
@if(open){
    <dialog
  class="ui-dialog ui-widget-content ui-corner-all ui-draggable ui-resizable"
  tabindex="-1"
  role="dialog"
  style="display:block;"
>
  <div id="dialog-box" class="ui-dialog-content ui-widget-content" role="document">
    <div class="modal-content">
      <div id="dialog-header" class="ui-dialog-titlebar ui-widget-header ui-corner-all ui-helper-clearfix" style="display: flex; justify-content: space-between;">
        <h5 class="ui-dialog-title">{{ config.title }}</h5>
        <button
          type="button"
          class="ui-dialog-titlebar-close ui-corner-all"
          data-dismiss="modal"
          aria-label="Close"
          (click)="discardWrapper($event)"
        >
          <span aria-hidden="true" class="ui-icon ui-icon-closethick">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <p>{{ config.description }}</p>
        <!-- This is temporary. Will fix later. -->
         <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div>
                <h2>Register</h2>
                <input formControlName="email" type="text" name="email" placeholder="Email" required>
                <input formControlName="password" type="text" name="password" placeholder="Password" required>
                <button type="submit" [disabled]="registerForm.invalid">Register</button>
            </div>

            <!-- <div>
                <h2>Login</h2>
                <form action="" (NgSubmit)="onSubmit(login)" #login="ngForm">
                    <input [(ngModel)]="email" type="text" name="email" placeholder="Email" required>
                    <input [(ngModel)]="password" type="text" name="password" placeholder="password" required>
                    <button type="submit" [disabled]="login.invalid">Login</button>
                </form>
            </div> -->
         </form>
        
        
        <!-- End temporary space -->
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-primary"
          (click)="saveWrapper($event)"
        >
          Save changes
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          data-dismiss="modal"
          (click)="discardWrapper($event)"
        >
          Close
        </button>
      </div>
    </div>
  </div>
</dialog>
}
