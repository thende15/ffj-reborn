					<!-- Need a new class for these that removes the background color, line-height, and padding (which is tied to input type=button)-->

					<button class="toolbar-buttons" type="button"><img src="//storage.proboards.com/forum/images/bbcode/code.png" alt="insert code"></button>
					<button class="toolbar-buttons" type="button"><img src="//storage.proboards.com/forum/images/bbcode/quote.png" alt="insert quote"></button>
					<button class="toolbar-buttons" type="button"><img src="//storage.proboards.com/forum/images/bbcode/smiley.png" alt="insert smiley"></button>
					<button class="toolbar-buttons" type="button"><img src="//storage.proboards.com/forum/images/bbcode/embed.png" alt="insert embed"></button>
					<button class="toolbar-buttons" type="button"><img src="//storage.proboards.com/7321693/images/HESiGRHoXTCljHnssubV.png" alt="insert spoiler"></button>
				</div>
				<!-- <app-text-editor [editor]="editor"></app-text-editor> -->
				 <tiptap-editor [editor]="editor"></tiptap-editor>
